<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300"
     font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="al-fwd" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="al-back" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1000" height="300" fill="#F8FAFC" rx="6"/>
  <text x="500" y="28" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2937">
    The Agentic Loop: How You Drive the Workflow
  </text>

  <!-- forward arrows between the four nodes -->
  <line x1="210" y1="120" x2="252" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#al-fwd)"/>
  <line x1="455" y1="120" x2="497" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#al-fwd)"/>
  <line x1="700" y1="120" x2="742" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#al-fwd)"/>

  <!-- node 1: You / prompt -->
  <rect x="40" y="78" width="170" height="84" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="125" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">You</text>
  <text x="125" y="128" text-anchor="middle" font-size="10.5" fill="#64748B">write a plain-language</text>
  <text x="125" y="143" text-anchor="middle" font-size="10.5" fill="#64748B">prompt</text>

  <!-- node 2: coding agent / skill -->
  <rect x="252" y="78" width="203" height="84" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="353" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Coding Agent</text>
  <text x="353" y="128" text-anchor="middle" font-size="10.5" fill="#64748B">loads the matching</text>
  <text x="353" y="143" text-anchor="middle" font-size="10.5" fill="#64748B">skill (SKILL.md)</text>

  <!-- node 3: tooling / Isaac Sim -->
  <rect x="497" y="78" width="203" height="84" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="598" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Isaac for Healthcare</text>
  <text x="598" y="128" text-anchor="middle" font-size="10.5" fill="#64748B">skill runs workflows/agentic</text>
  <text x="598" y="143" text-anchor="middle" font-size="10.5" fill="#64748B">tooling in Isaac Sim</text>

  <!-- node 4: result -->
  <rect x="742" y="78" width="170" height="84" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="827" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Result</text>
  <text x="827" y="128" text-anchor="middle" font-size="10.5" fill="#64748B">dataset · checkpoint</text>
  <text x="827" y="143" text-anchor="middle" font-size="10.5" fill="#64748B">· rollout video</text>

  <!-- feedback arc: Result -> You (review & refine) -->
  <path d="M 827 162 L 827 235 L 125 235 L 125 162"
        stroke="#374151" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#al-back)"/>
  <text x="476" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">
    You review every step, refine the prompt, and run again
  </text>

  <text x="500" y="272" text-anchor="middle" font-size="10.5" fill="#6B7280">
    Every stage of the course works this way: you stay in the loop, the agent does the wiring.
  </text>
</svg>
